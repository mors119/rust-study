```yaml
# ============================================================
# Rust CI
#
# 이 workflow의 목적:
# - 코드가 Rust 표준 포맷을 지키는지 검사한다.
# - workspace 전체가 정상적으로 타입 체크되는지 검사한다.
# - clippy lint를 강하게 적용해서 잠재적 버그와 나쁜 패턴을 잡는다.
# - 모든 테스트가 통과하는지 검사한다.
# - 문서 주석과 public API 문서가 깨지지 않는지 검사한다.
# - Cargo.lock 기준으로 재현 가능한 빌드가 되는지 검사한다.
# - 의존성 보안 취약점과 라이선스 정책 위반을 검사한다.
# - 테스트 커버리지 기준선을 만족하는지 검사한다.
#
# 이 파일은 예제용으로 매우 강한 설정이다.
# 작은 개인 프로젝트에서는 deny/audit/coverage를 별도 workflow로 분리해도 된다.
# ============================================================

name: Rust CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# CI가 저장소 내용을 읽는 것만 허용한다.
# 테스트/빌드/검사만 하는 workflow이므로 쓰기 권한이 필요 없다.
permissions:
  contents: read

env:
  # Cargo 출력에 색상을 유지한다.
  CARGO_TERM_COLOR: always

  # Rust 컴파일러 경고를 에러로 취급한다.
  # unused import, dead code, deprecated API 같은 경고도 CI 실패로 만든다.
  RUSTFLAGS: "-D warnings"

  # 테스트 실패나 panic 발생 시 스택 트레이스를 출력한다.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format / Check / Clippy / Test / Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # ------------------------------------------------------------
      # rustfmt 검사
      #
      # 검사 내용:
      # - Rust 코드가 표준 포맷을 따르는지 검사한다.
      # - 코드 스타일 논쟁을 줄이고, 리뷰에서 로직만 보게 만든다.
      #
      # 실패 예:
      # - 들여쓰기 불일치
      # - 줄바꿈 규칙 불일치
      # - import 정렬/배치 차이
      #
      # 수정 방법:
      # - 로컬에서 cargo fmt 실행
      # ------------------------------------------------------------
      - name: Check formatting
        run: cargo fmt --all -- --check

      # ------------------------------------------------------------
      # Cargo.lock 검사
      #
      # 검사 내용:
      # - Cargo.lock이 현재 Cargo.toml과 일치하는지 검사한다.
      # - CI에서 의존성 버전이 임의로 갱신되지 않게 막는다.
      #
      # --locked 의미:
      # - Cargo.lock 변경이 필요하면 CI를 실패시킨다.
      # - 재현 가능한 빌드를 보장한다.
      #
      # 실패 예:
      # - Cargo.toml에 dependency를 추가했지만 Cargo.lock을 커밋하지 않음
      # - dependency 버전을 바꿨지만 lockfile이 갱신되지 않음
      #
      # 수정 방법:
      # - 로컬에서 cargo check 또는 cargo update 실행 후 Cargo.lock 커밋
      # ------------------------------------------------------------
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      # ------------------------------------------------------------
      # 타입 체크
      #
      # 검사 내용:
      # - workspace 전체가 컴파일 가능한지 빠르게 확인한다.
      # - 실제 바이너리를 끝까지 만들지는 않지만 타입, trait bound, module path,
      #   feature 조합, dependency 연결 문제를 대부분 잡는다.
      #
      # --workspace:
      # - 모든 workspace member 검사
      #
      # --all-targets:
      # - lib, bin, tests, examples, benches까지 검사
      #
      # --all-features:
      # - optional feature까지 켠 상태로 검사
      #
      # --locked:
      # - Cargo.lock 기준으로만 검사
      #
      # 실패 예:
      # - use 경로 오류
      # - pub/private 접근 오류
      # - trait 구현 누락
      # - test target에서만 발생하는 컴파일 오류
      # ------------------------------------------------------------
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      # ------------------------------------------------------------
      # Clippy 검사
      #
      # 검사 내용:
      # - Rust 컴파일러보다 더 엄격한 정적 분석을 수행한다.
      # - 성능 저하 가능성, 불필요한 clone, 비효율적 API 사용,
      #   가독성 낮은 패턴, 잠재적 버그를 잡는다.
      #
      # -D warnings:
      # - clippy 경고를 모두 에러로 처리한다.
      #
      # --all-targets:
      # - 테스트 코드와 예제 코드까지 lint 대상에 포함한다.
      #
      # --all-features:
      # - feature가 켜졌을 때만 컴파일되는 코드도 검사한다.
      #
      # 실패 예:
      # - new_without_default
      # - needless_borrow
      # - unnecessary_to_owned
      # - dead_code
      # - unused_imports
      #
      # 수정 방법:
      # - clippy가 제안하는 help를 우선 반영
      # - 정말 의도한 코드라면 #[allow(...)]를 최소 범위로 사용
      # ------------------------------------------------------------
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # ------------------------------------------------------------
      # 테스트
      #
      # 검사 내용:
      # - unit test, integration test, doc test를 실행한다.
      # - 실제 로직이 의도대로 동작하는지 검증한다.
      #
      # --all-features:
      # - 모든 feature를 켠 상태에서 테스트한다.
      #
      # --locked:
      # - Cargo.lock 기준으로만 테스트한다.
      #
      # 실패 예:
      # - assert 실패
      # - panic 발생
      # - 파일 시스템 테스트에서 경로 처리 오류
      # - feature 조합에서만 발생하는 런타임 오류
      # ------------------------------------------------------------
      - name: Run tests
        run: cargo test --workspace --all-features --locked

      # ------------------------------------------------------------
      # 문서 빌드
      #
      # 검사 내용:
      # - public API 문서가 정상적으로 생성되는지 검사한다.
      # - doc comment 내부의 Rust 코드 예제가 깨지는 문제를 조기에 발견한다.
      #
      # RUSTDOCFLAGS="-D warnings":
      # - 문서 경고도 에러로 처리한다.
      #
      # --no-deps:
      # - 내 crate 문서만 검사하고 dependency 문서는 생성하지 않는다.
      #
      # 실패 예:
      # - 깨진 intra-doc link
      # - 잘못된 문서 코드 예제
      # - public item 문서 구성 오류
      # ------------------------------------------------------------
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --locked --no-deps

  security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # ------------------------------------------------------------
      # cargo-audit
      #
      # 검사 내용:
      # - Cargo.lock에 포함된 dependency 중 알려진 보안 취약점이 있는지 검사한다.
      # - RustSec Advisory Database 기준으로 검사한다.
      #
      # 실패 예:
      # - 취약한 crate 버전을 사용 중
      # - 더 이상 유지보수되지 않는 취약 dependency 사용
      #
      # 수정 방법:
      # - cargo update -p crate_name
      # - dependency 버전 업그레이드
      # - 대체 crate 검토
      # ------------------------------------------------------------
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # ------------------------------------------------------------
      # cargo-deny
      #
      # 검사 내용:
      # - 의존성 라이선스가 프로젝트 정책에 맞는지 검사한다.
      # - 중복 버전 dependency가 과도하게 생겼는지 검사한다.
      # - 금지한 crate가 포함되었는지 검사한다.
      # - 허용하지 않은 registry/git source가 있는지 검사한다.
      #
      # 필요 파일:
      # - deny.toml
      #
      # 생성 방법:
      # - cargo deny init
      #
      # 실패 예:
      # - GPL 계열 라이선스 dependency가 들어옴
      # - 같은 crate의 여러 major/minor 버전이 동시에 포함됨
      # - 허용하지 않은 git dependency 사용
      #
      # 수정 방법:
      # - deny.toml 정책 조정
      # - dependency 버전 통일
      # - 문제가 되는 crate 제거 또는 대체
      # ------------------------------------------------------------
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency policy
        run: cargo deny check

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # ------------------------------------------------------------
      # cargo-llvm-cov
      #
      # 검사 내용:
      # - 테스트가 실제 코드 라인을 얼마나 실행했는지 측정한다.
      # - 기능이 추가되었는데 테스트가 없는 상황을 조기에 발견한다.
      #
      # --fail-under-lines 80:
      # - line coverage가 80% 미만이면 CI 실패
      #
      # --all-features:
      # - feature가 켜졌을 때의 코드까지 포함한다.
      #
      # 주의:
      # - 초기 프로젝트에서는 80% 기준이 너무 높을 수 있다.
      # - 처음에는 50~60으로 시작하고 점진적으로 올려도 된다.
      #
      # 수정 방법:
      # - 핵심 service, parser, repository 테스트 추가
      # - error path 테스트 추가
      # - edge case 테스트 추가
      # ------------------------------------------------------------
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Check test coverage
        run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80

  minimal-versions:
    name: Minimal Versions Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 최소 버전 검사
      #
      # 검사 내용:
      # - Cargo.toml에 적힌 최소 dependency 버전으로도 빌드되는지 확인한다.
      # - 실수로 최신 transitive dependency에만 의존하는 코드를 작성했는지 잡는다.
      #
      # 예:
      # serde = "1" 이라고 적었는데 실제로는 serde 1.0.200 이상 API를 사용하면
      # 최소 버전 검사에서 실패할 수 있다.
      #
      # 주의:
      # - 이 검사는 일부 생태계에서 실패가 잦다.
      # - 예제용 강한 CI에는 좋지만, 실제 프로젝트에서는 필요할 때만 켜도 된다.
      # ------------------------------------------------------------
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate minimal lockfile
        run: cargo +nightly update -Z minimal-versions

      - name: Check minimal dependency versions
        run: cargo +nightly check --workspace --all-targets --locked
```
